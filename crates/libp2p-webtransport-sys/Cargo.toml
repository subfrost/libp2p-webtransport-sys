[package]
name = "libp2p-webtransport-sys"
version = "0.1.0"
edition = "2021"

[dependencies]
wtransport = { path = "../wtransport", features = ["quinn", "tokio-dns"] }
libp2p = { git = "https://github.com/libp2p/rust-libp2p", features = ["tokio", "noise", "macros", "ed25519"] }
multihash = "0.19.3"
multihash-codetable = { version = "0.1.4", features = ["sha2"] }
futures = "0.3.28"
tracing = "0.1"
thiserror = "1.0"
url = "2.4.0"
sha2 = "0.10.8"
tokio-util = { version = "0.7", features = ["compat"] }
rcgen = "0.11.1"
time = { version = "0.3", features = ["std", "serde"] }
rustls-pemfile = "2.1.0"
rustls-pki-types = { version = "1.12.0", features = ["alloc"] }
rustls = "0.23.10"
webpki-roots = "0.26.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
async-trait = "0.1.73"
log = "0.4"


[dev-dependencies]
env_logger = "0.10"
futures-util = "0.3.30"
log = "0.4"
shellexpand = "3.1.0"
pem = "3.0.4"
